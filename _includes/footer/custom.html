<!-- Render ```mermaid code blocks as diagrams. Mermaid loads only on pages that have one. -->
<script type="module">
  const blocks = new Set();
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
    blocks.add(el.closest("div.language-mermaid") || el.parentElement);
  });

  if (blocks.size > 0) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    const nodes = [...blocks].map((block) => {
      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      block.replaceWith(diagram);
      return diagram;
    });
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    await mermaid.run({ nodes });
  }
</script>
